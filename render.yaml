# Penny on Render — the whole deployment in one file.
#
# Three services: a managed Postgres, the Spring Boot API built from its
# Dockerfile, and the React frontend as a static site. Keeping this in the
# repository rather than clicking through a dashboard means the deployment is
# reviewable, diffable, and reproducible from scratch — which for a ledger
# matters more than usual, because "what is actually running in production" is
# the kind of question an auditor asks.
#
# First deploy:
#   1. Render Dashboard → New → Blueprint → connect this repository.
#   2. Render reads this file and creates all three services.
#   3. Copy the generated PENNY_BOOTSTRAP_ADMIN_PASSWORD out of the backend's
#      Environment tab — it is shown there and nowhere else — then sign in as
#      "admin" and change it.
#
# See the Deployment section of README.md for the full runbook.

databases:
  - name: penny-db
    databaseName: penny
    user: penny
    plan: free
    # Free Postgres on Render expires after 30 days. For anything that needs to
    # outlive that, move this to the starter plan; nothing else here changes.

services:
  # --- API ----------------------------------------------------------------
  - type: web
    name: penny-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      # Turns on ProductionSafetyCheck, which refuses to start on a placeholder
      # signing key rather than quietly issuing forgeable tokens.
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Render injects PORT; application.yml already reads it.

      # The connection string Render exposes is a postgres:// URL, which JDBC
      # will not parse. application.yml composes a JDBC URL from these parts
      # instead, which avoids having to rewrite the scheme at runtime.
      - key: DB_HOST
        fromDatabase:
          name: penny-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: penny-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: penny-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: penny-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: penny-db
          property: password

      # Free Postgres allows few connections; a pool sized for a laptop will
      # exhaust them and fail with an error that looks like the database is
      # down rather than like the pool is too large.
      - key: DB_POOL_SIZE
        value: "5"

      # Generated by Render and never stored in the repository. Rotating it
      # invalidates every issued access token, which is the intended behaviour.
      - key: JWT_SECRET
        generateValue: true

      # NOT wired with fromService, deliberately. The frontend already
      # references this API that way, and pointing this back at the frontend
      # creates a circular reference that Render cannot resolve: one of the two
      # variables silently comes back empty. When it was VITE_API_BASE_URL that
      # emptied, the frontend fell back to http://localhost:8080 and every call
      # from the deployed site went nowhere -- a failure with no server log and
      # no status code, because the request never left the browser.
      #
      # A pattern over Render's own domain breaks the cycle. It is broader than
      # naming one origin, which is a real trade-off: any onrender.com site
      # could issue a cross-origin request. It cannot do anything with one --
      # every endpoint except the index and login requires a bearer token this
      # grants no way to obtain. Narrow it to your exact frontend origin once
      # the URL is known, which is strictly better.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.onrender.com,http://localhost:*"


      # First-run only. BootstrapRunner refuses to touch a non-empty users
      # table, so redeploys cannot resurrect this password after it is changed.
      - key: PENNY_BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
      - key: PENNY_SEED_DEMO
        value: "true"
      - key: PENNY_DEMO_PASSWORD
        generateValue: true

  # --- Frontend -----------------------------------------------------------
  - type: web
    name: penny-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Set this by hand, once, after the first deploy:
      #
      #     https://<your-api-service>.onrender.com
      #
      # It cannot be wired with fromService. Render's `property: host` returns
      # the *internal* private-network name -- literally "penny-api", with no
      # domain -- which is routable between Render services but means nothing
      # in a visitor's browser. Using it here produced a frontend calling
      # https://penny-api, which fails DNS, and a sign-in error carrying no
      # status code and leaving no server-side log, because the request never
      # left the browser. There is no blueprint property for a service's public
      # URL, so this is honestly a manual step rather than a cleverer expression.
      #
      # Vite inlines the value at build time, so changing it needs a rebuild,
      # not a restart.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # The router owns every path, so unknown URLs must reach index.html
      # rather than Render's 404. Without this, refreshing on /transactions —
      # or opening a shared filtered link, which is half the point of putting
      # filter state in the URL — returns a server 404.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
