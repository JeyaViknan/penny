spring:
  application:
    name: penny
  datasource:
    # Composed from parts so a managed-Postgres provider can supply host, port
    # and database name as separate variables -- Render hands out a
    # postgres:// connection string, which JDBC does not accept as-is. DB_URL
    # still overrides the whole thing when a provider gives a usable JDBC URL.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:penny}}
    username: ${DB_USERNAME:penny}
    password: ${DB_PASSWORD:penny}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

penny:
  # Browser origins allowed to call this API. The default is local development
  # only; deployments set CORS_ALLOWED_ORIGINS to their own frontend origin.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}
  # First-run setup. Unset by default: with no password configured the runner
  # does nothing, so an existing database is never touched. See BootstrapRunner
  # for why this cannot simply live in a migration.
  bootstrap:
    admin-password: ${PENNY_BOOTSTRAP_ADMIN_PASSWORD:}
    admin-email: ${PENNY_BOOTSTRAP_ADMIN_EMAIL:admin@penny.local}
    seed-demo: ${PENNY_SEED_DEMO:false}
    demo-password: ${PENNY_DEMO_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_THIS_MUST_BE_AT_LEAST_256_BITS_LONG}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  # Counterparty for deposits and withdrawals. Seeded by migration V6; see
  # CashService for why money entering the ledger still needs two legs.
  vault-account-number: ${VAULT_ACCOUNT_NUMBER:000000000001}
  pagination:
    default-page-size: 25
    max-page-size: 100

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
