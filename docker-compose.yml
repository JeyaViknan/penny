services:
  postgres:
    image: postgres:16-alpine
    container_name: penny-postgres
    environment:
      POSTGRES_DB: penny
      POSTGRES_USER: penny
      POSTGRES_PASSWORD: penny
    ports:
      # Host port is configurable because 5432 is very often already taken by a
      # locally installed Postgres, which silently shadows this container and
      # produces a confusing "role does not exist" error. Override with
      # POSTGRES_HOST_PORT=5433 if that happens.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - penny-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penny -d penny"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: penny-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/penny
      DB_USERNAME: penny
      DB_PASSWORD: penny
      JWT_SECRET: local-dev-secret-key-not-for-production-use-change-me-1234567890
      CORS_ALLOWED_ORIGINS: "http://localhost:*"
      # First-run bootstrap, mirroring the deployed configuration so the two
      # cannot drift. Only ever applies to an empty users table.
      PENNY_BOOTSTRAP_ADMIN_PASSWORD: Admin@12345
      PENNY_SEED_DEMO: "true"
      PENNY_DEMO_PASSWORD: Password123!
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: penny-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  penny-pgdata:
