services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerlite-postgres
    environment:
      POSTGRES_DB: ledgerlite
      POSTGRES_USER: ledgerlite
      POSTGRES_PASSWORD: ledgerlite
    ports:
      - "5432:5432"
    volumes:
      - ledgerlite-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerlite -d ledgerlite"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ledgerlite-pgdata:
